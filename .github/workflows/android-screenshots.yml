# Runs the app in an Android emulator and saves screenshots of each screen.
# Start it from the Actions tab ("Run workflow").
name: Android screenshots
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run in emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: android
          script: bash ci/screenshots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: android/screenshots/
      - name: Save screenshots to the "screenshots" branch
        if: always()
        working-directory: android/screenshots
        run: |
          git init -q -b screenshots
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Screenshots from run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
