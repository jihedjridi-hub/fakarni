# Builds the Android app on every push to main and publishes the APK as the "latest" release,
# so you can download and install it straight from your phone.
name: Android build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk fakarni.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fakarni-apk
          path: android/fakarni.apk
      - name: Publish as "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest fakarni.apk --prerelease --title "Latest build (#${{ github.run_number }})" \
            --notes "Built from ${GITHUB_SHA::7}. Open this page on your Android phone and tap fakarni.apk to install."
