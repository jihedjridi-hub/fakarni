# XcodeGen spec. On a Mac: `brew install xcodegen && xcodegen` creates LocationReminders.xcodeproj
name: LocationReminders
options:
  bundleIdPrefix: com.example          # GUESS: change to your own reverse domain
  deploymentTarget:
    iOS: "17.0"
packages:
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    from: "9.0.0"
targets:
  LocationReminders:
    type: application
    platform: iOS
    sources: [LocationReminders]
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    dependencies:
      - package: GoogleMaps
        product: GoogleMaps
    info:
      path: LocationReminders/Resources/Info.plist
      properties:
        CFBundleDisplayName: Location Reminders
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        GMSApiKey: $(GOOGLE_MAPS_API_KEY)
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Shows where you are on the map while you set up reminders."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Lets the app remind you when you arrive at a place, even when the app is closed."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.locationreminders
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
schemes:
  LocationReminders:
    build:
      targets:
        LocationReminders: all
